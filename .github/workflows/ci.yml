name: CI - LangChain Radar

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Dependencies
        run: |
          uv venv
          uv pip install -e ".[dev,embeddings]"

      - name: Lint and Format Check (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Strict Type Checking (Mypy)
        run: |
          uv run mypy src tests

      - name: Unit & Integration Tests (Pytest)
        run: |
          uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=85
