[project]
name = "langchain-radar"
version = "0.1.0"
description = "Pipeline RAG de Ingesta Continua para el ecosistema LangChain"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Data Engineering & AI Platform Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "qdrant-client>=1.9.0",
    "minio>=7.2.0",
    "pyarrow>=16.0.0",
    "deltalake>=0.17.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "respx>=0.21.0",
]
embeddings = [
    "onnxruntime>=1.18.0",
    "tokenizers>=0.19.0",
    "fastembed>=0.8.0",
    "numpy>=1.26.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "deltalake.*",
    "minio.*",
    "respx.*",
    "pygit2.*",
    "tree_sitter.*",
    "fastembed.*",
    "onnxruntime.*",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
